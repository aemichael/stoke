##### stoke search config file

--opc_whitelist "{ subq.* movq.* movl.* movw.* movb.* andq.* orq.* xorq.* }"

--def_in "{ %rdi %rsi }" # The registers that are defined on entry to the target
--live_out "{ %rax }" # The registers that are live on exit from the target

--training_set "{ 0 ... 999 }" # Testcases to use for measuring correctness during search
--test_set "{ 1000 ... 1023 }"  # Testcases to use as holdout set for checking correctness

--distance hamming # Metric for measuring error between live-outs
--misalign_penalty 1 # Penalty for results that appear in the wrong location
--reduction sum # Method for summing errors across testcases
--sig_penalty 9999 # Score to assign to rewrites that produce non-zero signals

--add_nops_mass 1
--delete_mass 1
--global_swap_mass 1 # Proposal mass
--instruction_mass 1 # Proposal mass
--local_swap_mass 1 # Proposal mass
--opcode_mass 1 # Proposal mass
--operand_mass 1 # Proposal mass
--rotate_mass 1 # Proposal mass
--opcode_width_mass 1

--beta 1 # Search annealing constant
--initial_instruction_number 24 # The maximum number of instruction allowed in a rewrite

--statistics_interval 1000000 # Print statistics every 1m proposals
--timeout_iterations 100000000 # Propose 100m modifications total before giving up
--cycle_timeout 1000000 # Try 1m modifications before restarting

--strategy leakage # Verify results using a larger hold out testcase set
--leakage_reduction value_ranges
--solver_timeout 120000 # Time out solver queries after 120k ms (2 min)

--cost "correctness + 50 * leakage + latency / 10"
--postprocessing simple
--cpu_flags "{}"
